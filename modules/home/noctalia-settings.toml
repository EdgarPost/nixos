[bar.default]
center = [ "clock", "bar" ]
end = [ "battery", "tray" ]
margin_edge = 0
margin_ends = 0
position = "bottom"
radius = 0
shadow = false
start = [ "recorder" ]

[calendar]
enabled = true

    [calendar.account.home_nextcloud]
    type = "google"

    [calendar.account.personal_google]
    type = "google"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600

[location]
address = ""
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-5", "lockscreen-login-box@DP-4" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-4"]
    box_height = 196.0
    box_width = 720.0
    cx = 2048.0
    cy = 1605.0
    output = "DP-4"
    placement_height = 1728.0
    placement_width = 4096.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-4".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-5"]
    box_height = 196.0
    box_width = 720.0
    cx = 2560.0
    cy = 2041.0
    output = "DP-5"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-5".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[notification]
position = "bottom_center"

[osd]
position = "bottom_center"
position_vertical = "bottom_center"

[plugin_settings."noctalia/screen_recorder"]
video_codec = "hevc"

[plugins]
enabled = [ "noctalia/screen_recorder", "felipeartur/ai-usagebar" ]

[shell]
screen_time_enabled = true

    [shell.animation]
    enabled = false

    [shell.launcher.providers.emoji]
    global = false
    prefix = ""

    [shell.panel]
    control_center_position = "center"
    launcher_categories = false
    launcher_compact = true

    [shell.screen_corners]
    enabled = true

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "ghostty", "hyprland" ]
    community_ids = [ "pi-agent", "zen-browser", "neovim", "steam", "yazi" ]
    enable_community_templates = false

[wallpaper]
directory = "/home/edgar/.wallpapers"
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]
transition_on_startup = true

    [wallpaper.automation]
    enabled = false

    [wallpaper.default]
    path = "/home/edgar/.wallpapers/tropic_island_night.jpg"

    [wallpaper.last]
    path = "/home/edgar/.wallpapers/tropic_island_night.jpg"

    [wallpaper.monitors.DP-4]
    path = "/home/edgar/.wallpapers/tropic_island_night.jpg"

[widget.bar]
type = "felipeartur/ai-usagebar:bar"

[widget.clock]
format = "{:%d %B - %H:%M}"

[widget.cpu]
capsule = true
capsule_padding = 13.0
stat = "ram_used"

[widget.network_rx]
display = "graph"

[widget.notifications]
hide_when_no_unread = true

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.spacer_2]
type = "spacer"

[widget.tray]
match_adjacent_spacing = true
